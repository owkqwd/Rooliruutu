<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Rooliruutu logo tausta -->
  <rect width="512" height="512" rx="96" fill="#201C1D" />
  
  <!-- Ylävasen: Vihreä rooliruutu -->
  <rect x="110" y="98" width="114" height="114" rx="28" fill="#16C72E" />
  
  <!-- Yläoikea: Sininen rooliruutu -->
